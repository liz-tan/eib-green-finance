# ---------------------------------------------------------------------------
# COMPLETE IRELAND PILOT — scrape all available years for Ireland.
#
# Collection: pull the full history (years: "all") — cheap and complete; never
# pre-truncate. Analysis window is a separate decision: the proposal frames
# coverage as post-2000, bounded at the firm-outcome end by Orbis depth (~2008+).
# To restrict collection instead, set  years: []  and  year_from: 2000.
# ---------------------------------------------------------------------------

slice:
  country: "Ireland"
  years: "all"              # "all" | [2021,2022,...] | [] with year_from/year_to
  year_from:                # e.g. 2000  (used only when years is [] or null)
  year_to:
  sectors: []               # [] = all sectors
  status: "financed"        # signed operations

paths:
  spine_export: "data/raw/loanExport.xlsx"   # optional cross-check only
  cas_dir: "data/raw"                         # CAS files for build_cas.py

fetch:
  contact: "research-scraper (LSE)"
  min_delay_seconds: 1.5    # be gentle with the portal
  max_retries: 4
  cache_dir: "data/interim/cache"   # point to a local path outside OneDrive if syncing

harvest:
  item_per_page: 200        # list-API page size
